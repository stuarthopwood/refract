name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test, lint, build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Vitest auto-discovers every src/**/*.test.ts (vitest.config.ts's own `include`); no
      # separate step is needed to name any individual suite here.
      - name: Vitest
        run: pnpm test

      - name: Check indentation
        run: pnpm check:indent

      - name: Check theme contrast
        run: pnpm check:theme-contrast

      - name: Check drag regions
        run: pnpm check:drag-regions

      # Parity gate switched on at #796 (R13, Electron deleted): fails the build if any
      # `IPC_REQUESTS`/`IPC_EVENTS`/theme-bootstrap channel in `src/shared/ipc.ts` has no Rust
      # implementation under `src-tauri/src`. check:mermaid-contrast is not run here until #388
      # fixes its known failures.
      - name: Check IPC parity
        run: pnpm check:parity -- --gate

      - name: Check file size
        run: pnpm check:file-size

      - name: Check comment density
        run: pnpm check:comment-density

      - name: Check spacing grid
        run: pnpm check:spacing

      - name: Check opacity modifiers
        run: pnpm check:alpha-modifiers

      - name: Check icon-only controls
        run: pnpm check:icon-only-controls

      - name: Check literal colours
        run: pnpm check:literal-colours

      - name: Check hit targets
        run: pnpm check:hit-targets

      - name: Check advisor roster
        run: pnpm check:advisor-roster

      # Release pipeline (scripts/release.mjs is the only thing allowed to bump these): fails
      # unless package.json, src-tauri/tauri.conf.json, src-tauri/Cargo.toml ([package]
      # refract-tauri), and src-tauri/Cargo.lock (the refract-tauri entry) all name the same
      # version.
      - name: Check version consistency
        run: pnpm check:versions

      # Issue #519/#795 (R12b): flags an OMP wire command/frame-type string literal Refract
      # reads or writes that the vendored rpc-wire schema (scripts/fixtures/omp-schema/) doesn't
      # know about (this fails the step). `--check-pin` additionally reports, non-fatally, when
      # that vendored schema is behind the npm registry's current @oh-my-pi/pi-coding-agent
      # version; it never fails the step regardless of what it finds.
      - name: Check OMP schema drift
        run: pnpm check:omp-schema -- --check-pin

      # Gate infrastructure, not a product check: proves the drift detector above can actually
      # fail by seeding deliberately undeclared literals and asserting its own detection logic
      # flags every one of them (see check-omp-schema-drift.mjs's own --self-test header
      # comment). Exits 1 if any self-test assertion fails.
      - name: Check OMP schema drift self-test
        run: pnpm check:omp-schema -- --self-test

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      # Includes the issue #795 (R12b) Rust integration tests under src-tauri/tests/
      # (transcript_golden.rs, contract_replay.rs, transcript_terminated_unexpectedly_tests.rs)
      # -- Cargo auto-discovers everything under tests/, so no separate step is needed for them.
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # Debug profile: reuses the dev-profile artefacts from the test and lint steps. The
      # release build (pnpm build) is the same code with optimisation.
      - name: Build (Tauri debug, no bundle smoke)
        run: pnpm tauri build --debug --no-bundle

      # Scans the renderer bundle the build step just wrote to out/tauri-web.
      - name: Check UI text
        run: pnpm check:ui-text
