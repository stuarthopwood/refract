name: Issue triage

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to triage
        required: true
        type: string
      force:
        description: Re-triage even if the issue already has the `triaged` label
        required: false
        type: boolean
        default: false

# Least privilege by default; each job grants only what it needs.
permissions: {}

concurrency:
  group: issue-triage-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  triage:
    name: Classify and label
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      route: ${{ steps.triage.outputs.route }}
      prep: ${{ steps.triage.outputs.prep }}
      issue_number: ${{ steps.triage.outputs.issue_number }}
      feature_directory: ${{ steps.export.outputs.feature_directory }}
    steps:
      # Issue events normally run on the default branch, but `workflow_dispatch`
      # can be invoked from any ref, so the default-branch ref is pinned
      # explicitly rather than assumed — this is the trusted reference tree
      # every script below is reviewed against.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Run script tests
        run: node --test .github/scripts/triage.test.mjs
      - name: Classify the issue
        id: triage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          FORCE: ${{ inputs.force }}
          # Optional: without it the deterministic keyword heuristic classifies the issue.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRIAGE_MODEL: ${{ vars.TRIAGE_MODEL }}
        run: node .github/scripts/triage.mjs
      # Only runs when triage.mjs itself decided prep is eligible: route !=
      # none, state == ready-for-agent, a real collaborator with write
      # access, and the secret present (see triage.mjs for the exact gate).
      - name: Export the issue for the prep agent
        id: export
        if: steps.triage.outputs.prep == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.triage.outputs.issue_number }}
          # Gates feature_directory resolution: only a converge run ever gets
          # one (a specify run creates its own new feature and must not).
          ROUTE: ${{ steps.triage.outputs.route }}
        run: node .github/scripts/prep-guard.mjs export
      - name: Upload the issue export
        if: steps.triage.outputs.prep == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue-export
          path: .triage
          include-hidden-files: true
          retention-days: 1

  # Drafts Spec Kit artifacts with the agent. No GH_TOKEN/GITHUB_TOKEN at the
  # job level, no `contents: write`, and no git commands at all: this job can
  # read the checked-out default branch and the issue export, and can only
  # write inside specs/**/docs/** via the scoped Edit/Write permission, but it
  # has no way to push, comment, or otherwise act on the repository. Its only
  # output is the `prep-output` artifact, which the `publish` job (a
  # different job, with its own credentials) validates before it ever touches
  # git.
  prep-agent:
    name: Draft Spec Kit artifacts (sandboxed, no write token)
    needs: triage
    if: needs.triage.outputs.prep == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # The default-branch ref is pinned explicitly (not assumed from the
      # trigger event), and this never starts from an existing
      # triage/issue-<N> branch, whose .omp/commands, .specify/scripts,
      # CLAUDE.md, or .claude/settings.json a previous (agent-influenced) run
      # could have rewritten.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Download the issue export
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: issue-export
          path: .triage
      - name: Run Spec Kit prep
        uses: anthropics/claude-code-action@12dd8d74c712f5f3669365b2369b558c495b1104 # v1
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          # Only meaningful for the converge route, and only for the
          # underlying Spec Kit PowerShell scripts (common.ps1's own
          # explicit-override resolution) — the agent itself cannot read
          # this env var (its shell access is limited to specific script
          # invocations, not a general shell), so the same value is also
          # given to it directly as FEATURE_DIRECTORY in the prompt text
          # below. Either way this never commits the gitignored
          # .specify/feature.json: for specify, create-new-feature.ps1
          # writes that file itself for the rest of this job's own Spec Kit
          # script invocations, and it is never part of what gets uploaded
          # or published (see docs/issue-triage.md).
          SPECIFY_FEATURE_DIRECTORY: ${{ needs.triage.outputs.feature_directory }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # This job's permissions are contents:read only, so github.token
          # here is a read-only token: the agent cannot label, comment, or
          # push anything through it, and this job has no git credentials at
          # all.
          github_token: ${{ github.token }}
          prompt: |
            Read .github/triage/prompt.md and follow it exactly.
            ROUTE=${{ needs.triage.outputs.route }}
            ISSUE_FILE=.triage/issue-${{ needs.triage.outputs.issue_number }}.md
            FEATURE_DIRECTORY=${{ needs.triage.outputs.feature_directory }}
          claude_args: >-
            --max-turns 80
            --allowedTools "Read(./**),Glob,Grep,Edit(specs/**),Edit(docs/**),Bash(pwsh .specify/scripts/powershell/create-new-feature.ps1 *),Bash(pwsh .specify/scripts/powershell/setup-plan.ps1 *),Bash(pwsh .specify/scripts/powershell/setup-tasks.ps1 *),Bash(pwsh .specify/scripts/powershell/check-prerequisites.ps1 *),Bash(pwsh .specify/scripts/powershell/resolve-template.ps1 *)"
      # Uploads the whole specs/+docs/ tree, not a diff: this job has no git,
      # so it cannot compute one. `publish`'s guard (prep-guard.mjs apply)
      # tolerates that by only treating a file as in scope if it is new or
      # byte-different from the trusted default-branch checkout.
      - name: Upload the prep output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prep-output
          path: |
            specs
            docs
          retention-days: 1
          if-no-files-found: warn

  publish:
    name: Guard, commit, and open the draft PR
    needs: [triage, prep-agent]
    if: needs.triage.outputs.prep == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.triage.outputs.issue_number }}
      ROUTE: ${{ needs.triage.outputs.route }}
      BRANCH: triage/issue-${{ needs.triage.outputs.issue_number }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      # A fresh checkout of the default branch (ref pinned explicitly, not
      # assumed) — trusted scripts, and the reference tree the guard below
      # diffs against. Never the agent's own checkout from `prep-agent`.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Download the prep output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: prep-output
          path: ${{ runner.temp }}/prep-output
      # Validates and copies into the working tree while it is still the
      # known-good default-branch checkout, before any branch is created:
      # the guard's "is this file unchanged from a trusted copy" check
      # (which lets the whole-tree upload above through) must compare
      # against this tree, never one a prior, agent-influenced run could
      # have tampered with.
      - name: Apply the guarded prep output
        run: node .github/scripts/prep-guard.mjs apply "${{ runner.temp }}/prep-output"
      # Always branches fresh from the default-branch checkout above, never
      # from a previous run's triage/issue-<N> tip: reusing that tip via
      # `git switch -c "$BRANCH" "origin/$BRANCH"` does not work, because
      # `git switch` does a checkout, not a merge, and aborts whenever the
      # already-applied guard output and the remote tip touch the same
      # lines — which a second run for the same issue does by construction.
      # Each run instead regenerates the branch from scratch and replaces
      # whatever was pushed before (see the force-with-lease push below).
      - name: Create the prep branch
        run: git switch -c "$BRANCH"
      - name: Commit and push the prep branch
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git add -A -- specs docs
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Spec prep for #${ISSUE_NUMBER} (/speckit.${ROUTE})"

          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          export GIT_CONFIG_COUNT=1
          # A path prefix of both the "https://github.com/owner/repo" form
          # actions/checkout leaves as origin's URL and the ".../repo.git"
          # form some tools use, so the header actually matches and is sent
          # either way. A ".git"-suffixed key here (what this used to be)
          # never matches checkout's URL, so git silently never attaches the
          # header and every push fails unauthenticated.
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH"

          # The exact ref, not a `--heads <name>` suffix pattern: the latter
          # would also match an unrelated ref merely ending in "/$BRANCH".
          set +e
          LS_OUT="$(git ls-remote --exit-code origin "refs/heads/$BRANCH" 2>&1)"
          LS_RC=$?
          set -e
          if [ "$LS_RC" -eq 0 ]; then
            REMOTE_SHA="$(printf '%s' "$LS_OUT" | awk '{print $1}')"
            # Full history, not the shallow depth-1 this job's checkout has:
            # a shallow clone can't tell that an older commit the existing
            # branch shares with HEAD is shared rather than foreign, which
            # would make the authorship check below misfire on every push.
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              git fetch --unshallow origin
            fi
            git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            FOREIGN="$(git log --format='%ae' "HEAD..refs/remotes/origin/$BRANCH" | grep -v -F -x "41898282+github-actions[bot]@users.noreply.github.com" || true)"
            if [ -n "$FOREIGN" ]; then
              # A human (for example review fixes) committed to the existing
              # branch: never force-overwrite those. Publish this run under
              # a new, run-scoped branch name instead, leaving the original
              # branch (and any PR on it) untouched; $GITHUB_ENV updates
              # $BRANCH for every later step, including the PR/comment one.
              BRANCH="${BRANCH}-${GITHUB_RUN_ID}"
              echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
              echo "fresh_branch=true" >> "$GITHUB_OUTPUT"
              git push origin "HEAD:refs/heads/$BRANCH"
            else
              git push --force-with-lease="refs/heads/$BRANCH:${REMOTE_SHA}" origin "HEAD:refs/heads/$BRANCH"
              echo "fresh_branch=false" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$LS_RC" -eq 2 ]; then
            git push origin "HEAD:refs/heads/$BRANCH"
            echo "fresh_branch=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::git ls-remote failed unexpectedly (exit $LS_RC) while checking for an existing $BRANCH" >&2
            echo "$LS_OUT" >&2
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open a draft pull request and report
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.push.outputs.changed }}
          FRESH_BRANCH: ${{ steps.push.outputs.fresh_branch }}
        run: |
          set -e
          if [ "$CHANGED" != "true" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "> *This was generated by AI during triage.*

          Spec prep (\`/speckit.${ROUTE}\`) finished without producing any spec changes."
            exit 0
          fi
          NOTE=""
          if [ "$FRESH_BRANCH" = "true" ]; then
            NOTE=" (a previous \`triage/issue-${ISSUE_NUMBER}\` branch already has commits that are not the bot's own — likely review feedback — so this run was pushed to \`$BRANCH\` instead, leaving that branch untouched)"
          fi
          # Only a same-repo PR authored by this workflow's own token counts:
          # `--head` alone also matches a fork's PR of a branch with the same
          # name, which would let an attacker's arbitrary-code PR be endorsed
          # here instead of the real one this run just pushed.
          EXISTING_URL="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json url,isCrossRepository,author -q '[.[] | select(.isCrossRepository==false and .author.login=="github-actions[bot]")][0].url // empty' 2>/dev/null || true)"
          if [ -n "$EXISTING_URL" ]; then
            RESULT="Spec prep is ready for review: ${EXISTING_URL}${NOTE}"
          else
            BODY="Spec artifacts prepared by the issue triage workflow for #${ISSUE_NUMBER} (route: \`${ROUTE}\`). Spec, plan, and tasks only. No application code. Review before merging; assumed clarification answers are flagged in the spec.

          Refs #${ISSUE_NUMBER}"
            PR_STDERR="$RUNNER_TEMP/pr-create.stderr"
            if PR_URL="$(gh pr create --draft --base "$DEFAULT_BRANCH" --head "$BRANCH" --repo "$GITHUB_REPOSITORY" --title "Spec prep for #${ISSUE_NUMBER}" --body "$BODY" 2>"$PR_STDERR")"; then
              RESULT="Spec prep is ready for review: ${PR_URL}${NOTE}"
            else
              STDERR_TEXT="$(cat "$PR_STDERR" 2>/dev/null || true)"
              RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              if echo "$STDERR_TEXT" | grep -qi "not permitted to create or approve pull requests"; then
                RESULT="Spec prep was pushed to branch \`$BRANCH\`, but the workflow cannot open a pull request (the repository setting **Allow GitHub Actions to create and approve pull requests** is off). Open one: https://github.com/${GITHUB_REPOSITORY}/compare/${DEFAULT_BRANCH}...${BRANCH}?expand=1${NOTE}"
              else
                RESULT="Spec prep was pushed to branch \`$BRANCH\`, but opening a pull request failed. See the run for details: ${RUN_URL}${NOTE}"
              fi
            fi
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "> *This was generated by AI during triage.*

          $RESULT"

  notify-failure:
    name: Report a prep failure on the issue
    needs: [triage, prep-agent, publish]
    if: >-
      always() &&
      needs.triage.outputs.prep == 'true' &&
      (contains(fromJSON('["failure","cancelled"]'), needs.triage.result) ||
       contains(fromJSON('["failure","cancelled"]'), needs.prep-agent.result) ||
       contains(fromJSON('["failure","cancelled"]'), needs.publish.result))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Comment with a link to the failing run
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.triage.outputs.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "> *This was generated by AI during triage.*

          Spec prep failed. See the run for details: $RUN_URL"
