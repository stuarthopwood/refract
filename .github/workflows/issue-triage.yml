name: Issue triage

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to triage
        required: true
        type: string
      force:
        description: Re-triage even if the issue already has the `triaged` label
        required: false
        type: boolean
        default: false

# Least privilege by default.
permissions: {}

concurrency:
  group: issue-triage-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  triage:
    name: Classify and label
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      # Issue events normally run on the default branch, but `workflow_dispatch`
      # can be invoked from any ref, so the default-branch ref is pinned
      # explicitly rather than assumed — this is the trusted reference tree
      # the script below is reviewed against.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Secrets can't be referenced directly in a step `if:` condition, so
      # the presence check is computed here (in `env:`, which secrets are
      # always fine in) and read back from this step's own output.
      - name: Check for a Copilot CLI token
        id: copilot_check
        env:
          HAS_COPILOT: ${{ secrets.COPILOT_GITHUB_TOKEN != '' }}
        run: echo "present=$HAS_COPILOT" >> "$GITHUB_OUTPUT"
      - name: Install GitHub Copilot CLI
        if: steps.copilot_check.outputs.present == 'true'
        run: npm install -g @github/copilot
      - name: Run script tests
        run: node --test .github/scripts/triage.test.mjs
      - name: Classify the issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          FORCE: ${{ inputs.force }}
          # Optional, tried first via the `copilot` CLI (installed above only
          # when this secret is set); falls through to Anthropic, then the
          # heuristic, on any failure.
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          TRIAGE_COPILOT_MODEL: ${{ vars.TRIAGE_COPILOT_MODEL }}
          # Optional: without either key above, the deterministic keyword heuristic classifies the issue.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRIAGE_MODEL: ${{ vars.TRIAGE_MODEL }}
        run: node .github/scripts/triage.mjs
