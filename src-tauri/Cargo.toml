[package]
name = "refract-tauri"
version = "0.34.0"
description = "Rust (Tauri v2) backend of Refract (spec 016, issue #780, the architecture spec\nsince the parity gate and cutover, issue #796). The only desktop shell: the Electron build\n(src/main, src/preload) was deleted at the cutover."
edition = "2021"
rust-version = "1.90"

# See `tauri.conf.json`'s own `build` section for how `build.rs` and this manifest fit together.
[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[lib]
# Suffixed `_lib`, the standard Tauri convention (also required for a future mobile entry point,
# `#[cfg_attr(mobile, tauri::mobile_entry_point)]`), so the library target's name never collides
# with the `refract-tauri` binary crate (`src/main.rs`) on a platform where that matters (Windows
# DLL naming).
name = "refract_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2.8.2"
tauri-plugin-clipboard-manager = "2.4.2"
tauri-plugin-opener = "2.7.1"
tauri-plugin-log = "2.10.1"
# Window shell/chrome lane (R10b, issue #793): click-to-focus OS notifications
# (`shell::notifications`) and the second-launch focus-existing-window behaviour (`lib.rs`'s
# `single_instance::init` call). Neither needs a JS-side capability grant at all: both are driven
# entirely from Rust, never invoked from the renderer (`capabilities/default.json`'s own doc
# comment: capabilities gate webview-to-plugin calls only).
tauri-plugin-notification = "2.6.0"
tauri-plugin-single-instance = "2.5.3"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["full"] }
uuid = { version = "1.28.0", features = ["v4"] }
# Pinned to match `reqwest = { features = ["rustls"] }`'s own `base64 = "0.23"` dependency
# (code review, 2026-10-14): this crate otherwise resolves a second copy of `base64` alongside
# reqwest's.
base64 = "0.23"
# Decodes the Mermaid "Copy as image" PNG to RGBA for the clipboard (#471); already in the graph via tauri.
png = "0.18"
thiserror = "2.0.21"
log = "0.4.34"
dirs = "7.0.0"
which = "8.0.6"
# Lane R9 (#792): `github/profile.rs`'s bounded HTTPS requests to api.github.com/
# avatars.githubusercontent.com for a signed-in account's display profile/avatar (research.md
# decisions 3-5, specs/008-profile-and-accounts). `redirect::Policy::none()` is used at the call
# site so every redirect hop is re-validated against the avatar host allowlist by hand, matching
# the ported TS's own manual redirect loop -- reqwest's own automatic redirect following is
# never enabled.
#
# `features = ["rustls"]` (code review, 2026-10-14): this pulls in `aws-lc-rs`/`aws-lc-sys` (a
# C/assembly build step) as reqwest's default TLS crypto provider, alongside `ring`, which is
# already in the dependency graph transitively -- two crypto backends end up compiled into this
# binary. Accepted rather than switched to `rustls-no-provider` + an explicit `ring` install:
# that requires a process-wide `CryptoProvider::install_default()` call at startup (a new
# global-state dependency with no runtime test coverage in this build), for a build-time/binary-
# size cost only -- no runtime behaviour, security, or correctness issue follows from having two
# providers compiled in. Revisit if binary size becomes a real constraint.
# `json` added (lane R11b, issue #794): the GitHub Releases API JSON responses this lane's own
# `updates::checker`/`updates::dependency_install` parse.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
# Lane R9 (#792): `omp/redact.rs`, a line-for-line port of `src/main/omp/redact.ts`'s
# `redactSecrets` PATTERNS array. Several of those patterns rely on lookahead/lookbehind
# (`(?<!...)`, `(?<=...)`, `(?!...)`) that the `regex` crate (already in this graph
# transitively) does not support by design -- `regex`'s own docs point to `fancy-regex` as the
# crate to reach for when lookaround is unavoidable.
fancy-regex = "0.19.2"
dunce = "1.0.5"
# File Explorer recursive watcher (lane R7, issue #790): wraps `ReadDirectoryChangesW` on
# Windows. Not already in `Cargo.lock` (checked before adding, per the issue's own instruction);
# default features disabled (`macos_fsevent` and its `objc2-*` deps are irrelevant to this
# Windows-only build).
notify = { version = "8.1.0", default-features = false }

# Lane R11b (issue #794): SHA-256 verification of a downloaded Refract update installer against
# its published `.sha256` asset (research.md decision 4, spec 006).
sha2 = "0.10.8"

# Spec 060 (#1331, ADR 0006): Refract's own `usage.db`. `bundled` only (no `backup`, `serde_json`,
# `chrono` or `vtab`); the ingest worker is a plain `std::thread`, so the blocking API never
# runs on the IPC thread or the tokio pool.
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["test-util"] }

# Line tables keep file and line numbers in backtraces while dropping variable-level debug info,
# which is most of a dev build's size (shared target growth, #1736). `[profile.test]` inherits it.
[profile.dev]
debug = "line-tables-only"

# `windows-rs`: the Windows Job Object kill-on-close replacement for the Electron build's `koffi`
# FFI (`src/main/process/jobObject.ts`). Scoped to the Windows target only -- this crate is
# Windows-only anyway (spec.md Assumptions), but there is no reason to pull Win32 bindings into a
# build graph for any other target.
#
# Lane R11d (follow-up to #794): `Win32_Security_WinTrust`/`Win32_Security_Cryptography*` add
# `WinVerifyTrust` and the `WTHelper*` chain-inspection helpers `updates/signature.rs` uses to
# check the update installer's Authenticode signature and pin its signer certificate.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Security",
  # Lane R3 (issue #786): `GlobalMemoryStatusEx` for the start-queue's low-memory defer
  # (`startQueue.ts`'s own `isMemoryLow`) and `QueryFullProcessImageNameW` (already declared
  # under `Win32_System_Threading` above) for orphan pid reaping (`process/pidRecords.ts`).
  "Win32_System_SystemInformation",
  # Lane R3 (issue #786, security gate-fix round 6): `CreateToolhelp32Snapshot`/
  # `Process32FirstW`/`Process32NextW` for walking an orphaned `omp` root's own descendant
  # processes (broker/tool children) during reaping, never by name -- see
  # `pid_records.rs`'s own `kill_descendant_tree` doc comment.
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Security_WinTrust",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  # Issue #880 (gate round 1 real fix): `SetCurrentProcessExplicitAppUserModelID` and
  # `SHGetPropertyStoreForWindow`/`IPropertyStore::SetValue(PKEY_AppUserModel_ID)`
  # (`shell::app_identity`), so the taskbar/Alt-Tab/notification identity matches the Start
  # Menu/Desktop shortcut Tauri's own NSIS installer pins to the same id, both process-wide and
  # on the window itself (`shell::app_identity`'s own doc comments).
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  # Issue #880 (gate round 1 real fix): `LoadImageW`/`GetSystemMetrics`/`SendMessageW`/
  # `WM_SETICON` (`shell::app_identity::set_window_icons`) -- sends the taskbar/Alt-Tab `ICON_BIG`
  # no public Tauri/tao API reaches on Windows (that function's own doc comment).
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
  # Issue #891: `RmStartSession`/`RmRegisterResources`/`RmGetList`/`RmEndSession`
  # (`git/worktree_holders.rs`) name a program (and pid) holding a file open inside a Session's
  # worktree before Delete touches anything.
  "Win32_System_RestartManager",
  # Issue #561: `GetProcessMemoryInfo` (`session::health`) reads each agent's own working set.
  "Win32_System_ProcessStatus",
  # Issue #1431: ISpellChecker (composer menu spelling suggestions).
  "Win32_Globalization",
  "Win32_System_Com",
] }
# Issue #1666: the alarm toast needs the alarm scenario and a looping sound (`shell::alarm_toast`),
# which the notification plugin's string API cannot request. Same version the plugin already uses.
tauri-winrt-notification = "0.8.1"
