name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test, lint, build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Vitest
        run: pnpm test

      - name: Check indentation
        run: pnpm check:indent

      - name: Check theme contrast
        run: pnpm check:theme-contrast

      - name: Check drag regions
        run: pnpm check:drag-regions

      # Plain check:parity reports and never fails on missing channels; the parity gate
      # (--gate) is switched on at #796. check:mermaid-contrast is not run here until #388
      # fixes its known failures.
      - name: Check IPC parity
        run: pnpm check:parity

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # Debug profile: reuses the dev-profile artefacts from the test and lint steps. The
      # release build (pnpm build) is the same code with optimisation.
      - name: Build (Tauri debug, no bundle smoke)
        run: pnpm tauri build --debug --no-bundle

      # Scans the renderer bundle the build step just wrote to out/tauri-web.
      - name: Check UI text
        run: pnpm check:ui-text
