name: Release build verification

# Least privilege: this job only BUILDS and VERIFIES the Tauri NSIS bundle now -- it never
# publishes a GitHub Release (lane R11d, follow-up to #794). Stuart decided (2026-10-14) to sign
# releases locally with a self-signed code-signing certificate whose private key lives only in
# his own `Cert:\CurrentUser\My` store (not exportable, never present on, or copyable to, a CI
# runner). An installer this workflow produced is unsigned; `src-tauri/src/updates/signature.rs`'s
# updater pin would reject it on every install anyway, so publishing it here would only ship an
# asset no client could ever accept. This workflow stays as a build-and-verify smoke check: a tag
# push still confirms the NSIS bundle builds cleanly on a fresh Windows runner. Real releases are
# cut locally: `pnpm release:local` (see `scripts/release-local.mjs` and the README's "Releasing"
# section for the signing certificate's own facts and its renewal note).
on:
  push:
    tags:
      - "v*"

# `contents: read` (not `{}`): this repo is PRIVATE, so `actions/checkout` needs at least read
# access to clone it at all -- gate finding, PR #837 round 1, High (`{}` made every `v*` tag
# push fail before any build step ran). `ci.yml` uses the same grant for the same reason.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Build and verify installer (never published -- see workflow header)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Workflow-local, NOT the shared dev machine's `C:/Users/shopwood/code-target/refract`
      # convention (scripts/verify-tauri.mjs, CONTEXT.md) -- a CI runner has no other lane
      # contending for the same disk, so there is nothing to coordinate here. CARGO_INCREMENTAL=0
      # still travels with it: a one-shot build gains nothing from incremental artefacts and they
      # only cost disk/IO on a fresh runner.
      CARGO_TARGET_DIR: ${{ github.workspace }}\cargo-target
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Guards against tag/manifest drift: if a tag is ever pushed whose version doesn't match
      # tauri.conf.json, the persisted `availableVersion` (sourced from the tag Stuart's own
      # local release publishes) would never again equal the running binary's own
      # `package_info().version` (sourced from tauri.conf.json) --
      # src-tauri/src/updates/install_on_quit.rs's resolve_installing_state version-match check
      # would then report every install as failed, forever. Catching the mismatch here, before
      # any build work happens, is cheap and final.
      - name: Verify tag matches tauri.conf.json version
        shell: pwsh
        env:
          TAG_REF: ${{ github.ref_name }}
        run: |
          $tagVersion = $env:TAG_REF -replace '^v', ''
          $confVersion = (Get-Content -Raw -Path "src-tauri\tauri.conf.json" | ConvertFrom-Json).version
          if ($tagVersion -ne $confVersion) {
            Write-Error "Pushed tag '$env:TAG_REF' resolves to version '$tagVersion', but src-tauri/tauri.conf.json's version field is '$confVersion'. Update tauri.conf.json to match the tag (or push the correct tag) before releasing."
            exit 1
          }
          Write-Host "Tag version '$tagVersion' matches src-tauri/tauri.conf.json version '$confVersion'."

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Full bundle, NSIS only (tauri.conf.json's bundle.targets no longer lists msi -- see
      # specs/016-tauri-rust-build/installer-probes.md's Recommended design for R11b). Never
      # signed here (this workflow's own header comment); `scripts/release-local.mjs` signs and
      # publishes the real release artefact from Stuart's own workstation.
      - name: Build Tauri release bundle
        run: pnpm tauri build

      - name: Locate and report built installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "$env:CARGO_TARGET_DIR\release\bundle\nsis" -Filter "*-setup.exe" -Recurse | Select-Object -First 1
          if (-not $exe) {
            throw "No NSIS installer .exe found under $env:CARGO_TARGET_DIR\release\bundle\nsis"
          }
          Write-Host "Built (unsigned, never published by CI): $($exe.Name)"
