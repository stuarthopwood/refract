name: Issue triage

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to triage
        required: true
        type: string
      force:
        description: Re-triage even if the issue already has the `triaged` label
        required: false
        type: boolean
        default: false

# Least privilege by default; each job grants only what it needs.
permissions: {}

concurrency:
  group: issue-triage-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  triage:
    name: Classify and label
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      route: ${{ steps.triage.outputs.route }}
      trusted: ${{ steps.triage.outputs.trusted }}
      triaged: ${{ steps.triage.outputs.triaged }}
      issue_number: ${{ steps.triage.outputs.issue_number }}
    steps:
      # Issue events run on the default branch, so the script below is the reviewed one.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run script tests
        run: node --test .github/scripts/triage.test.mjs
      - name: Classify the issue
        id: triage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          FORCE: ${{ inputs.force }}
          # Optional: without it the deterministic keyword heuristic classifies the issue.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node .github/scripts/triage.mjs

  prep:
    name: Prepare Spec Kit artifacts
    needs: triage
    # Untrusted authors never reach the agent: only repository insiders, and only for spec work.
    if: >-
      needs.triage.outputs.triaged == 'true' &&
      needs.triage.outputs.route != 'none' &&
      needs.triage.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.triage.outputs.issue_number }}
      ROUTE: ${{ needs.triage.outputs.route }}
      BRANCH: triage/issue-${{ needs.triage.outputs.issue_number }}
    steps:
      - name: Check for the Anthropic API key
        id: secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "> *This was generated by AI during triage.*

          Spec prep (\`/speckit.${ROUTE}\`) was skipped: the \`ANTHROPIC_API_KEY\` repository secret is not set. Add it and re-run the **Issue triage** workflow with \`force\` enabled to prepare this issue."
          fi

      - uses: actions/checkout@v4
        if: steps.secret.outputs.present == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.secret.outputs.present == 'true'
        with:
          node-version: 22

      - name: Switch to the prep branch
        if: steps.secret.outputs.present == 'true'
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git switch -c "$BRANCH" "origin/$BRANCH"
          else
            git switch -c "$BRANCH"
          fi

      - name: Export the issue as data
        if: steps.secret.outputs.present == 'true'
        run: node .github/scripts/prep-guard.mjs export

      - name: Run Spec Kit prep
        if: steps.secret.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            Read .github/triage/prompt.md and follow it exactly.
            ROUTE=${{ needs.triage.outputs.route }}
            ISSUE_FILE=.triage/issue-${{ needs.triage.outputs.issue_number }}.md
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(pwsh .specify/scripts/powershell/:*),Bash(ls:*)"

      - name: Guard changed paths
        if: steps.secret.outputs.present == 'true'
        run: node .github/scripts/prep-guard.mjs check

      - name: Commit and push the prep branch
        id: push
        if: steps.secret.outputs.present == 'true'
        run: |
          git add specs docs .specify/feature.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Spec prep for #${ISSUE_NUMBER} (/speckit.${ROUTE})"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:refs/heads/$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open a draft pull request and report
        if: steps.secret.outputs.present == 'true'
        env:
          CHANGED: ${{ steps.push.outputs.changed }}
        run: |
          if [ "$CHANGED" != "true" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "> *This was generated by AI during triage.*

          Spec prep (\`/speckit.${ROUTE}\`) finished without producing any spec changes."
            exit 0
          fi
          BODY="Spec artifacts prepared by the issue triage workflow for #${ISSUE_NUMBER} (route: \`${ROUTE}\`). Spec, plan, and tasks only. No application code. Review before merging; assumed clarification answers are flagged in the spec.

          Refs #${ISSUE_NUMBER}"
          if URL="$(gh pr create --draft --base main --head "$BRANCH" --repo "$GITHUB_REPOSITORY" --title "Spec prep for #${ISSUE_NUMBER}" --body "$BODY" 2>/dev/null)"; then
            RESULT="Spec prep is ready for review: $URL"
          else
            RESULT="Spec prep was pushed to branch \`$BRANCH\`, but the workflow cannot open a pull request (the repository setting **Allow GitHub Actions to create and approve pull requests** is off). Open one: https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "> *This was generated by AI during triage.*

          $RESULT"
