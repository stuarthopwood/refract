<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <title>Refract (Rust preview)</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <!-- Copy of src/renderer/index.html's own CSP, extended for Tauri's IPC transport (FR-009):
         the webview posts every `invoke`/event call over `ipc:`/`http://ipc.localhost`, so
         `connect-src` must allow it, or every `refract_request` call would be silently blocked. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ipc: http://ipc.localhost"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/tauri-bridge/entry.ts"></script>
  </body>
</html>
